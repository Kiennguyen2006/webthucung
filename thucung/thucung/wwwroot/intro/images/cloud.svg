<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#d6ebff" />
    </linearGradient>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4a8ec2" flood-opacity="0.22" />
    </filter>
  </defs>
  <g filter="url(#cloudShadow)">
    <!-- Base soft puffs -->
    <path fill="url(#cloudGrad)" d="M 60,120 
             L 260,120 
             A 35,35 0 0,0 275,55 
             A 45,45 0 0,0 215,35 
             A 60,60 0 0,0 105,40 
             A 40,40 0 0,0 45,85 
             A 35,35 0 0,0 60,120 Z" />
    <!-- Highlights for 3D cartoon volume -->
    <ellipse cx="140" cy="50" rx="35" ry="20" fill="#ffffff" opacity="0.85" />
    <ellipse cx="210" cy="58" rx="25" ry="14" fill="#ffffff" opacity="0.8" />
    <ellipse cx="78" cy="85" rx="20" ry="12" fill="#ffffff" opacity="0.75" />
  </g>
</svg>

