<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="grassGradNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55efc4" />
      <stop offset="30%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#1b7a3d" />
    </linearGradient>
    <linearGradient id="grassGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7bed9f" />
      <stop offset="50%" stop-color="#2ed573" />
      <stop offset="100%" stop-color="#218c74" />
    </linearGradient>
    <filter id="grassShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#145228" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background grass layer -->
  <g fill="url(#grassGradMid)" opacity="0.85">
    <path d="M 0,120 Q 25,65 35,40 Q 45,70 60,120 Z" />
    <path d="M 50,120 Q 75,55 90,30 Q 100,65 120,120 Z" />
    <path d="M 130,120 Q 155,60 170,35 Q 185,75 200,120 Z" />
    <path d="M 220,120 Q 240,50 255,25 Q 265,65 280,120 Z" />
    <path d="M 300,120 Q 320,65 335,40 Q 345,75 360,120 Z" />
    <path d="M 350,120 Q 375,55 390,30 Q 395,70 400,120 Z" />
  </g>

  <!-- Foreground lush blades -->
  <g fill="url(#grassGradNear)" filter="url(#grassShadow)">
    <path d="M 15,120 Q 30,50 25,18 Q 45,65 55,120 Z" />
    <path d="M 40,120 Q 60,40 75,12 Q 78,55 85,120 Z" />
    <path d="M 75,120 Q 95,60 115,20 Q 110,65 120,120 Z" />

    <path d="M 140,120 Q 155,45 150,15 Q 170,60 180,120 Z" />
    <path d="M 170,120 Q 190,35 205,10 Q 210,50 215,120 Z" />
    <path d="M 205,120 Q 225,55 245,18 Q 240,60 250,120 Z" />

    <path d="M 270,120 Q 285,45 280,16 Q 300,60 310,120 Z" />
    <path d="M 300,120 Q 320,38 335,12 Q 340,55 345,120 Z" />
    <path d="M 335,120 Q 355,55 375,20 Q 370,65 385,120 Z" />
  </g>

  <!-- Cute Daisies & Wildflowers popping out -->
  <g id="grass-flowers">
    <!-- Flower 1 (White Daisy) -->
    <g transform="translate(100, 52)">
      <circle cx="0" cy="-6" r="4" fill="#ffffff" />
      <circle cx="6" cy="0" r="4" fill="#ffffff" />
      <circle cx="0" cy="6" r="4" fill="#ffffff" />
      <circle cx="-6" cy="0" r="4" fill="#ffffff" />
      <circle cx="4" cy="-4" r="3.5" fill="#ffffff" />
      <circle cx="4" cy="4" r="3.5" fill="#ffffff" />
      <circle cx="-4" cy="4" r="3.5" fill="#ffffff" />
      <circle cx="-4" cy="-4" r="3.5" fill="#ffffff" />
      <circle cx="0" cy="0" r="4.5" fill="#f1c40f" />
    </g>

    <!-- Flower 2 (Pink Blossom) -->
    <g transform="translate(230, 48)">
      <circle cx="0" cy="-5" r="4" fill="#ff9ff3" />
      <circle cx="5" cy="0" r="4" fill="#ff9ff3" />
      <circle cx="0" cy="5" r="4" fill="#ff9ff3" />
      <circle cx="-5" cy="0" r="4" fill="#ff9ff3" />
      <circle cx="0" cy="0" r="4" fill="#ffeaa7" />
    </g>

    <!-- Flower 3 (Golden Buttercup) -->
    <g transform="translate(325, 58)">
      <circle cx="0" cy="-5" r="3.5" fill="#ffeaa7" />
      <circle cx="5" cy="0" r="3.5" fill="#ffeaa7" />
      <circle cx="0" cy="5" r="3.5" fill="#ffeaa7" />
      <circle cx="-5" cy="0" r="3.5" fill="#ffeaa7" />
      <circle cx="0" cy="0" r="3.5" fill="#e67e22" />
    </g>
  </g>
</svg>

