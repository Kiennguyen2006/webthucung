<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" width="100%" height="100%">
  <defs>
    <!-- Frame Gradient -->
    <linearGradient id="doorFrameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d48a1c" />
      <stop offset="15%" stop-color="#f8c962" />
      <stop offset="50%" stop-color="#f5b841" />
      <stop offset="85%" stop-color="#f8c962" />
      <stop offset="100%" stop-color="#b86e06" />
    </linearGradient>

    <!-- Door Leaf Wood Gradient -->
    <linearGradient id="doorWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa" />
      <stop offset="40%" stop-color="#f7cb63" />
      <stop offset="100%" stop-color="#de9c16" />
    </linearGradient>

    <!-- Warm Inner Portal Light -->
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff8db" />
      <stop offset="60%" stop-color="#ffdc73" />
      <stop offset="100%" stop-color="#f4a100" />
    </radialGradient>

    <!-- Bone Sign Gradient -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fff9e6" />
      <stop offset="100%" stop-color="#ffecba" />
    </linearGradient>

    <!-- Gold Trim -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="50%" stop-color="#fdcb6e" />
      <stop offset="100%" stop-color="#e17055" />
    </linearGradient>

    <filter id="doorShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#1e3c10" flood-opacity="0.35" />
    </filter>
    <filter id="signGlow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f1c40f" flood-opacity="0.8" />
    </filter>
  </defs>

  <g id="door-full-assembly" filter="url(#doorShadow)">
    <!-- Outer Arched Frame -->
    <path d="M 30,390 L 30,120 A 110,110 0 0,1 250,120 L 250,390 Z" 
          fill="url(#doorFrameGrad)" 
          stroke="#fff4cc" stroke-width="4" />

    <!-- Inner Portal (The Glowing Warm World Revealed When Open) -->
    <path d="M 50,390 L 50,130 A 90,90 0 0,1 230,130 L 230,390 Z" 
          fill="url(#portalGlow)" />

    <!-- Light Rays Emitters (Inside Portal) -->
    <ellipse cx="140" cy="240" rx="70" ry="110" fill="#ffffff" opacity="0.65" filter="blur(8px)" />

    <!-- The Door Leaf (Rotatable in 3D) -->
    <g id="door-leaf-group">
      <path d="M 50,390 L 50,130 A 90,90 0 0,1 230,130 L 230,390 Z" 
            fill="url(#doorWoodGrad)" 
            stroke="#b86e06" stroke-width="3" />

      <!-- Inset Decorative Panels -->
      <!-- Top Arched Panel -->
      <path d="M 68,220 L 68,145 A 72,72 0 0,1 212,145 L 212,220 Z" 
            fill="none" stroke="#d48a1c" stroke-width="6" stroke-linejoin="round" />
      <path d="M 72,216 L 72,147 A 68,68 0 0,1 208,147 L 208,216 Z" 
            fill="none" stroke="#fff8dc" stroke-width="2" />

      <!-- Bottom Panel -->
      <rect x="68" y="245" width="144" height="125" rx="8" 
            fill="none" stroke="#d48a1c" stroke-width="6" />
      <rect x="72" y="249" width="136" height="117" rx="6" 
            fill="none" stroke="#fff8dc" stroke-width="2" />

      <!-- Ornate Golden Doorknob -->
      <circle cx="204" cy="235" r="14" fill="url(#goldTrim)" stroke="#b86e06" stroke-width="2" />
      <circle cx="204" cy="235" r="9" fill="#ffffff" opacity="0.4" />
      <circle cx="201" cy="232" r="3" fill="#ffffff" />
      <ellipse cx="204" cy="245" rx="3" ry="5" fill="#573802" />
    </g>

    <!-- Hanging Chains for Sign -->
    <line x1="85" y1="20" x2="85" y2="45" stroke="#f5b841" stroke-width="4" stroke-dasharray="2,3" />
    <line x1="195" y1="20" x2="195" y2="45" stroke="#f5b841" stroke-width="4" stroke-dasharray="2,3" />

    <!-- Bone Sign Hanging on Top of Door -->
    <g id="bone-sign" filter="url(#signGlow)" transform="translate(0, 15)">
      <!-- The Bone Contour: 4 circular lobe ends connected by center waist -->
      <path d="M 60,50 
               C 42,28 18,48 38,68 
               C 18,88 42,108 62,86 
               L 218,86 
               C 238,108 262,88 242,68 
               C 262,48 238,28 220,50 
               L 60,50 Z" 
            fill="url(#boneGrad)" 
            stroke="#f39c12" stroke-width="5" stroke-linejoin="round" />

      <!-- Inner Border for depth -->
      <path d="M 64,54 
               C 48,36 30,52 46,68 
               C 30,84 48,100 64,82 
               L 216,82 
               C 232,100 250,84 234,68 
               C 250,52 232,36 216,54 
               L 64,54 Z" 
            fill="none" stroke="#fffdf5" stroke-width="2.5" />

      <!-- KMNA Big Joyful Sign Text -->
      <text x="140" y="77" 
            text-anchor="middle" 
            font-family="'Trebuchet MS', 'Fredoka One', 'Arial Black', sans-serif" 
            font-size="34" 
            font-weight="900" 
            letter-spacing="3" 
            fill="#d35400" 
            stroke="#ffffff" 
            stroke-width="3" 
            paint-order="stroke fill">KMNA</text>
    </g>

    <!-- Warm Glowing Lanterns or Sparkles on Door sides -->
    <circle cx="28" cy="180" r="10" fill="#ffeaa7" opacity="0.8" filter="blur(3px)" />
    <circle cx="252" cy="180" r="10" fill="#ffeaa7" opacity="0.8" filter="blur(3px)" />
  </g>
</svg>

