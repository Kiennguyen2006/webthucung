<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="100%" height="100%">
  <defs>
    <linearGradient id="catCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa07a" />
      <stop offset="50%" stop-color="#f37a48" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
    <linearGradient id="catChest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff1e0" />
    </linearGradient>
    <filter id="catShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="5" flood-color="#2d5218" flood-opacity="0.22" />
    </filter>
  </defs>

  <g id="cat-root" filter="url(#catShadow)">
    <!-- Back far legs -->
    <g id="cat-leg-back-far" class="leg-anim leg-back-far">
      <path d="M 40,88 Q 30,105 28,125 Q 32,130 40,130 Q 45,124 48,105 Z" fill="#b84500" />
      <ellipse cx="34" cy="128" rx="6" ry="3.5" fill="#ffffff" />
    </g>
    <g id="cat-leg-front-far" class="leg-anim leg-front-far">
      <path d="M 108,88 Q 115,105 118,125 Q 122,130 130,130 Q 134,124 130,105 Z" fill="#b84500" />
      <ellipse cx="125" cy="128" rx="6" ry="3.5" fill="#ffffff" />
    </g>

    <!-- Swishing Cat Tail -->
    <g id="cat-tail" class="tail-anim">
      <path d="M 30,72 C 10,65 5,40 18,30 C 24,25 28,32 20,42 C 14,50 20,64 34,70 Z" fill="url(#catCoat)" />
      <!-- White tail tip -->
      <path d="M 18,30 C 22,26 26,30 20,40 C 16,36 15,32 18,30 Z" fill="#ffffff" />
    </g>

    <!-- Cat Body -->
    <g id="cat-body">
      <ellipse cx="75" cy="78" rx="46" ry="26" fill="url(#catCoat)" />
      <!-- Cream Belly -->
      <path d="M 55,92 Q 80,102 108,86 Q 98,72 70,78 Z" fill="url(#catChest)" opacity="0.95" />
      <!-- Cute tabby stripes -->
      <path d="M 60,56 Q 63,66 60,72" stroke="#d35400" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 72,54 Q 75,66 72,74" stroke="#d35400" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 84,56 Q 87,66 84,72" stroke="#d35400" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- Near legs -->
    <g id="cat-leg-back-near" class="leg-anim leg-back-near">
      <path d="M 50,88 Q 40,105 44,128 Q 50,133 58,132 Q 62,125 60,105 Z" fill="url(#catCoat)" />
      <ellipse cx="50" cy="130" rx="7" ry="4" fill="#ffffff" />
    </g>
    <g id="cat-leg-front-near" class="leg-anim leg-front-near">
      <path d="M 96,88 Q 102,108 105,128 Q 110,133 118,132 Q 122,125 116,105 Z" fill="url(#catCoat)" />
      <ellipse cx="112" cy="130" rx="7" ry="4" fill="#ffffff" />
    </g>

    <!-- Cat Head -->
    <g id="cat-head" class="head-anim">
      <!-- Back Ear -->
      <polygon points="112,38 120,12 134,32" fill="#d35400" />
      <polygon points="116,36 122,18 130,32" fill="#ffb4a2" />

      <!-- Head Base -->
      <ellipse cx="124" cy="52" rx="26" ry="24" fill="url(#catCoat)" />

      <!-- Front Ear -->
      <g id="cat-ear-front" class="ear-anim">
        <polygon points="98,36 106,10 120,30" fill="url(#catCoat)" />
        <polygon points="102,34 108,16 116,30" fill="#ffb4a2" />
      </g>

      <!-- Head Stripes -->
      <path d="M 120,30 L 120,38" stroke="#d35400" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 126,30 L 126,38" stroke="#d35400" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 114,33 L 116,40" stroke="#d35400" stroke-width="2" stroke-linecap="round" />

      <!-- Cute Big Cat Eyes -->
      <ellipse cx="116" cy="48" rx="5" ry="6.5" fill="#2d3436" />
      <circle cx="118" cy="46" r="2" fill="#2ecc71" opacity="0.8" />
      <circle cx="117.5" cy="45.5" r="1.5" fill="#ffffff" />
      <circle cx="114.5" cy="49.5" r="0.8" fill="#ffffff" />

      <ellipse cx="134" cy="48" rx="5" ry="6.5" fill="#2d3436" />
      <circle cx="136" cy="46" r="2" fill="#2ecc71" opacity="0.8" />
      <circle cx="135.5" cy="45.5" r="1.5" fill="#ffffff" />

      <!-- Cheeks Muzzle -->
      <ellipse cx="126" cy="58" rx="10" ry="6" fill="url(#catChest)" />
      <!-- Pink Nose -->
      <polygon points="124,54 128,54 126,57" fill="#ff7675" />
      <!-- Mouth -->
      <path d="M 123,58 Q 126,61 129,58" stroke="#2d3436" stroke-width="1.5" fill="none" stroke-linecap="round" />

      <!-- Cute Whiskers -->
      <line x1="98" y1="55" x2="114" y2="56" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <line x1="100" y1="60" x2="114" y2="59" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <line x1="138" y1="56" x2="152" y2="55" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <line x1="138" y1="59" x2="150" y2="60" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

      <!-- Blushing Cheeks -->
      <ellipse cx="110" cy="56" rx="5" ry="3" fill="#ff7675" opacity="0.45" />
      <ellipse cx="140" cy="56" rx="5" ry="3" fill="#ff7675" opacity="0.45" />
    </g>
  </g>
</svg>

